[project]
name = "version-checker"
version = "0.1.0"
description = "A tool to check for software updates by comparing installed executable versions with web-scraped latest versions"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["version", "update", "scraper", "executable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests",
    "pyyaml",
    "beautifulsoup4",
    "pefile",
    "packaging",
    "pywin32; sys_platform == 'win32'",
    "click",
    "psutil",
    "rich",
    "ruff>=0.14.3",
    "hydra-core>=1.3",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

[project.scripts]
version-checker = "version_checker.cli:cli"
vcheck = "version_checker.cli:cli"

[project.urls]
Homepage = "https://github.com/yourusername/version-checker"
Repository = "https://github.com/yourusername/version-checker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["version_checker"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=version_checker"
testpaths = ["tests"]

[tool.coverage.run]
source = ["version_checker", "tests"]
omit = [
    "debug_cache.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
